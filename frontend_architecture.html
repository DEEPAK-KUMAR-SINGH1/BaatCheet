  .panel-close {
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
    color: #666;
    background: none;
    border: none;
    padding: 0 4px;
    transition: color 0.15s;

  .panel-desc { font-size: 13px; color: #999; line-height: 1.6; margin-bottom: 12px; }
  .feat-list { list-style: none; margin-bottom: 12px; }

    color: #b0afaa;
    padding: 4px 0;
    display: flex;
    gap: 9px;
    line-height: 1.5;
    border-bottom: 1px solid #1e1e28;

    background: #12121a;
    border: 1px solid #2e2e3e;
    color: #888;

const DATA = {

  },
  backend: {
    title: "Backend API — FastAPI server",
    desc: "Vite dev server /api calls ko localhost:8000 pe proxy karta hai. LangGraph aur Mistral AI se chat process hota hai.",
    feats: [
      "/auth/* — JWT tokens, OTP email verification",
      "/threads/* — create, list, rename, delete",
      "/chat — LangGraph streaming (NDJSON)",
      "/rag/upload — document chunking + embedding",
      "/rag/chat — RAG-based streaming response",
      "/admin/users — list, approve, revoke",
      "/auth/me/stats — chatCount, isAdmin, isApproved"
    ],
    tags: ["FastAPI", "LangGraph", "Mistral", "SQLite", "NDJSON"]
  }
};

function show(key) {
  const d = DATA[key];
  if (!d) return;
  document.getElementById('p-title').textContent = d.title;
  document.getElementById('p-desc').textContent = d.desc;
  document.getElementById('p-feats').innerHTML = d.feats.map(f => `<li>${f}</li>`).join('');
  document.getElementById('p-tags').innerHTML = d.tags.map(t => `<span class="tag">${t}</span>`).join('');
  document.getElementById('overlay').classList.remove('hidden');
}
function hide() {
  document.getElementById('overlay').classList.add('hidden');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });
</script>
</body>
